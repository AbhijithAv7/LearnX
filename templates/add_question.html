{% extends "instructor_sidebar.html" %}

{% block link %}

<link rel="stylesheet" href="/static/css/panel.css">

{% endblock %}

{% block content %}

 <a href="{% url 'instructor_courses' %}?tab=academics&course_id={{ course.id }}" class="back-btn">
        ⬅ Back
    </a>

<div class="add_course container">

    <h2>Add Exam & Questions</h2>

    <form method="POST">
        {% csrf_token %}

        {% if not exam %}

            <input class="form-control" type="text" name="exam_title" placeholder="Exam Title" required>

            <button class="btn btn-dark w-100" type="submit">
                Start Adding Questions
            </button>

        {% else %}

            <h4 class="mt-3">Exam: {{ exam.title }}</h4>

            <input class="form-control" type="text" name="question" placeholder="Question" required>

            <input class="form-control" type="text" name="o1" placeholder="Option 1" required>

            <input class="form-control" type="text" name="o2" placeholder="Option 2" required>

            <input class="form-control" type="text" name="o3" placeholder="Option 3" required>

            <input class="form-control" type="text" name="o4" placeholder="Option 4" required>

            <input class="form-control" type="number" name="correct" placeholder="Correct Option (1-4)" min="1" max="4" required>

            <button class="btn btn-dark w-100" type="submit" name="add_more">
                + Add Question
            </button>

            <button class="btn btn-success w-100 mt-2" type="submit" name="finish">
                ✔ Submit Exam
            </button>

        {% endif %}
    </form>

   

</div>

{% endblock %}

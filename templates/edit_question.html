{% extends "instructor_sidebar.html" %}

{% block content %}

<h2>Edit Question</h2>

<form method="POST">
    {% csrf_token %}

    <!-- ✅ EDIT EXAM TITLE -->
    <label>Exam Title:</label><br>
    <input type="text" name="exam_title" value="{{ exam.title }}" required><br><br>

    <!-- ✅ QUESTION -->
    <label>Question:</label><br>
    <input type="text" name="question" value="{{ q.question_text }}" required><br><br>

    <!-- ✅ OPTIONS -->
    <label>Option 1:</label><br>
    <input type="text" name="o1" value="{{ q.option1 }}" required><br><br>

    <label>Option 2:</label><br>
    <input type="text" name="o2" value="{{ q.option2 }}" required><br><br>

    <label>Option 3:</label><br>
    <input type="text" name="o3" value="{{ q.option3 }}" required><br><br>

    <label>Option 4:</label><br>
    <input type="text" name="o4" value="{{ q.option4 }}" required><br><br>

    <!-- ✅ CORRECT OPTION -->
    <label>Correct Option:</label><br>
    <input type="number" name="correct" value="{{ q.correct_option }}" min="1" max="4" required><br><br>

    <button type="submit">Update</button>
</form>

{% endblock %}

{% extends "staff_sidebar.html" %}

{% block content %}

<h2>Attendance</h2>

<table >
    <tr>
        <th>Student</th>
        <th>Status</th>
    </tr>

    {% for d in data %}
    <tr>
        <td>{{ d.student }}</td>
        <td>
            {% if d.status == "Present" %}
                ✅ Present
            {% else %}
                ❌ Not Watched
            {% endif %}
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">No data</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}

{% extends "base.html" %}

{% block code %}

<style>
.container {
    max-width: 700px;
    margin: auto;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* Card */
.staff-card {
    background: #fff;
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

/* Text */
.staff-id {
    font-size: 13px;
    color: #888;
}

.staff-name {
    font-weight: bold;
    font-size: 16px;
}

.staff-email {
    color: #555;
    font-size: 14px;
    margin-bottom: 10px;
}

/* Buttons */
.btn {
    padding: 5px 10px;
    text-decoration: none;
    border-radius: 5px;
    margin-right: 5px;
    font-size: 13px;
}

.edit-btn {
    background: #007bff;
    color: white;
}

.delete-btn {
    background: red;
    color: white;
}

/* Back button */
.back-btn {
    display: inline-block;
    margin-top: 15px;
    padding: 6px 12px;
    border: 1px solid black;
    border-radius: 5px;
    text-decoration: none;
    color: black;
}

/* Empty */
.empty-text {
    text-align: center;
    color: #777;
}
</style>

<div class="container">
    <h2>👩‍💼 Staff List</h2>

    {% for staff in staff %}
    <div class="staff-card">
        <div class="staff-id">ID: {{ staff.id }}</div>
        <div class="staff-name">{{ staff.username }}</div>
        <div class="staff-email">{{ staff.email }}</div>

        <div>
            <a href="{% url 'update_user' staff.id %}" class="btn edit-btn">Edit</a>

            <a href="{% url 'delete_user' staff.id %}" 
               class="btn delete-btn"
               onclick="return confirm('Are you sure you want to delete this staff?');">
               Delete
            </a>
        </div>
    </div>

    {% empty %}
        <p class="empty-text">No staff found</p>
    {% endfor %}

    <a href="{% url 'admin_dashboard' %}" class="back-btn">⬅ Back</a>
</div>

{% endblock %}

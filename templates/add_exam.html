{% extends "instructor_sidebar.html" %}

{% block link %}
<link rel="stylesheet" href="/static/css/panel.css">
{% endblock %}

{% block content %}

<a href="{% url 'instructor_courses' %}?tab=academics&course_id={{ course.id }}" class="back-btn">
        ⬅ Back
    </a>

<div class="add_course container">

    <h2>Create Exam</h2>

    <form method="POST">
        {% csrf_token %}

        <input class="form-control" type="text" name="title" placeholder="Exam Title" required>

        <button class="btn btn-dark w-100" type="submit">
            + Add Questions
        </button>
    </form>

    {% if exam %}
    <a href="{% url 'view_questions' exam.id %}">
        <button class="btn btn-outline-dark w-100 mt-2">
            👁 View Questions
        </button>
    </a>
    {% endif %}

</div>


{% endblock %}

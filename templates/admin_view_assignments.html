{% extends "base.html" %}

{% block link %}

<link rel="stylesheet" href="/static/css/style.css">

<style>
body {
    background: #f4f6f9;
}

/* Back button */
.back-btn {
    display: inline-block;
    margin: 15px 0;
    padding: 6px 12px;
    border: 1px solid black;
    border-radius: 5px;
    text-decoration: none;
    color: black;
    background: white;
}

.back-btn:hover {
    background: #eee;
}

/* Title */
h2 {
    text-align: center;
    color: #333;
    margin-bottom: 20px;
}

/* Container */
.assignment-container {
    max-width: 600px;
    margin: auto;
}

/* Card */
.assignment-card {
    background: #fff;
    padding: 12px 15px;
    margin-bottom: 10px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

/* Empty */
.empty-text {
    text-align: center;
    color: #777;
}
</style>

{% endblock %}

{% block code %}

<title>All Assignments</title>    

<a href="{% url 'admin_dashboard' %}" class="back-btn">
   ← Back
</a>

<h2>All Assignments</h2>

<div class="assignment-container">

{% for assignment in assignments %}
    <div class="assignment-card">
        {{ assignment.title }}
    </div>
{% empty %}
    <p class="empty-text">No assignments found</p>
{% endfor %}

</div>

{% endblock %}

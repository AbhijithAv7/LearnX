{% extends "base.html" %}

{% block code %}

<h2>Update Staff Allocation</h2>

<form method="POST">
    {% csrf_token %}

    <label>Staff:</label>
    <select name="staff">
        {% for s in staffs %}
        <option value="{{ s.id }}" {% if s.id == alloc.staff.id %}selected{% endif %}>
            {{ s.username }}
        </option>
        {% endfor %}
    </select>

    <label>Course:</label>
    <select name="course">
        {% for c in courses %}
        <option value="{{ c.id }}" {% if c.id == alloc.course.id %}selected{% endif %}>
            {{ c.title }}
        </option>
        {% endfor %}
    </select>

    <label>Batch:</label>
    <select name="batch">
        {% for b in batches %}
        <option value="{{ b.id }}" {% if b.id == alloc.batch.id %}selected{% endif %}>
            {{ b.name }}
        </option>
        {% endfor %}
    </select>

    <button type="submit">Update</button>
</form>

{% endblock %}
